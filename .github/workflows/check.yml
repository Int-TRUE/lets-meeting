name: Check
on:
  push:
    branches: ['task/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: butler
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: butler_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U butler -d butler_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLAYWRIGHT_CHANNEL: chrome
      POSTGRES_TEST_URL: postgresql://butler:test-only-password@127.0.0.1:5432/butler_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run build
      - run: npm test
      - run: npm run test:selfhost
      - run: npm run test:selfhost:http
      - run: python3 scripts/selfhost-network.test.py
      - run: python3 scripts/account-maintenance.test.py
      - run: node --test scripts/judging-dataset.test.mjs
      - run: python3 scripts/replace-judging-data.test.py
      - name: Verify preinstalled browser
        run: google-chrome --version
      - run: npm run test:e2e
      - run: npm run test:db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
